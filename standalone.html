      past.push({project:clone(project),mapId:activeMapId});if(past.length>50)past.shift();future=[];project=candidate;applied=true;
      const added=currentMap().graph.nodes.length-snapshot.graph.nodes.length,edges=currentMap().graph.edges.length-snapshot.graph.edges.length,proposals=currentMap().graph.proposals.length-snapshot.graph.proposals.length;
      aiLastResult=[`${added} elemento${added===1?'':'s'} e ${edges} ${edges===1?'relação':'relações'} acrescentados ao mapa.`,proposals?`${proposals} ${proposals===1?'alteração aguarda':'alterações aguardam'} revisão.`:'',...(plan.warnings||[])].filter(Boolean).join(' ');
      await persist();aiDraft='';await saveAIText();renderView();fitAfter=!snapshot.graph.nodes.length&&added>0;

    finally{clearTimeout(timer);aiAbort=null;}

}

function humanPath(change){
  const labels={name:'Nome',description:'Descrição',status:'Estado',position:'Posição',x:'Horizontal',y:'Vertical',context:'Contexto',kind:'Tipo',origin:'Origem',author:'Autor',properties:'Propriedades',pivotal:'Evento central',evidence_ids:'Evidências',objective:'Objetivo e escopo',modality:'Profundidade',nodes:'Elementos',edges:'Relações',sources:'Fontes',evidences:'Evidências',proposals:'Propostas',answers:'Respostas',relation:'Significado',label:'Rótulo',content:'Conteúdo',quote:'Trecho',explanation:'Explicação',decision:'Decisão',reason:'Motivo',answer:'Resposta',question:'Pergunta',primary_map:'Mapa principal',maps:'Mapas',width:'Largura',height:'Altura',$order:'Ordem'};
  const parts=(Array.isArray(change.path)?change.path.map(p=>typeof p==='object'?p.id:p):String(change.path||'').split('/')).filter(Boolean);
  const mapOffset=parts[0]==='maps'?2:0,map=mapOffset?projectMaps(project).find(map=>map.id===parts[1]):projectMaps(project)[0];
  const graphParts=parts.slice(mapOffset),collection=graphParts[0]==='graph'?graphParts[1]:null,entityId=collection?graphParts[2]:null;
  const values=collection&&Array.isArray(map?.graph[collection])?map.graph[collection]:[];

  const name=entity?.name||entity?.node?.name||snapshot?.name;
  const pathParts=collection?graphParts.slice(entityId?3:2):mapOffset?parts.slice(2):parts;
  const fields=pathParts.filter(p=>p!=='id').map(p=>labels[p]||(/^[a-f0-9-]{24,}$/i.test(p)?'Conteúdo':p));
  return [collection||mapOffset?map?.name:null,name||(collection?labels[collection]:null),...fields].filter(Boolean).join(' › ')||'Conteúdo do projeto';
}

});
document.addEventListener('change',e=>run(async()=>{const el=e.target;if(busy)return;if(el.id==='active-map'){await switchMap(el.value);return;}if(el.id==='http-profile'){httpEditorId=el.value;httpNotice='';httpPreview='';httpResult=null;await saveHTTPDraft();renderPanel();return;}if(el.id==='http-preset'&&el.value){const previous=selectedHTTPRequest(),r=newHTTPRequest(el.value);r.id=previous.id;httpDraft.requests[httpDraft.requests.indexOf(previous)]=r;httpNotice='Modelo aplicado. Ajuste os campos e salve.';httpPreview='';httpResult=null;await saveHTTPDraft();renderPanel();return;}if(el.dataset.httpField||el.dataset.httpRow){editHTTPField(el);if(el.dataset.httpField==='method'&&['GET','HEAD'].includes(el.value))selectedHTTPRequest().body_type='none';if(['auth.type','body_type','method'].includes(el.dataset.httpField))renderPanel();return;}if(el.id==='http-config-file'){const file=el.files[0];if(!file)return;if(file.size>1000000)throw Error('Configuração excede 1 MB.');const imported=JSON.parse(await file.text());if(imported.format!=='event-storm-local-http'||imported.version!==1)throw Error('Arquivo de configuração HTTP não reconhecido.');httpDraft=normalizeAIHTTP(imported.ai_http);httpEditorId=httpDraft.active_id||httpDraft.requests[0]?.id||'';httpNotice='Configuração importada. Clique em Salvar e usar para ativar.';httpPreview='';httpResult=null;await saveHTTPDraft();renderPanel();return;}if(el.id==='ai-consent')aiRemoteConsent=el.checked;if(el.id==='filter'){filter=el.value;renderView();}if(el.id==='modality')mutate(p=>updateMap(p,activeMapId,{modality:el.value}));if(el.id==='ai-file'){const file=el.files[0];if(!file)return;if(file.size>100000||!/(\.txt|\.md)$/i.test(file.name))throw Error('Use TXT ou Markdown até 100 KB.');const content=await file.text();if(content.length>30000)throw Error('Máximo de 30 mil caracteres. Divida o conteúdo.');aiDraft=content;await saveAIText();$('#ai-message').value=content;}if(el.id==='text-file'){const f=el.files[0];if(!f)return;if(f.size>100_000||!/(\.txt|\.md)$/i.test(f.name))throw Error('Use TXT ou Markdown até 100 KB.');const content=await f.text();if(content.length>30_000)throw Error('Máximo de 30 mil caracteres. Divida o conteúdo.');$('#extract-form [name="content"]').value=content;$('#extract-form [name="sourceName"]').value=f.name;}}));
document.addEventListener('submit',e=>{e.preventDefault();run(async()=>{const f=e.target;if(busy)return;if(locked()&&['extract-form','ai-form','version-form'].includes(f.id)){toast('Resolva as diferenças antes de continuar.');return;}if(f.id==='map-form'){if(locked())return;const name=f.elements.name.value.trim();if(!name)return;let id=f.dataset.id;if(mutate(p=>{if(id)updateMap(p,id,{name});else id=addMap(p,name);},{redraw:false})){closeModal();await switchMap(id);showPanel('maps');}return;}if(f.id==='create-form'){const name=f.elements.name.value.trim();if(!name)return;const text=f.dataset.mode==='text';await create(newProject(name,f.elements.objective.value));closeModal();showPanel(text?'import':'interview');}if(f.id==='ai-form'){await sendAI(f);return;}if(f.id==='extract-form'){mergeExtraction(extractContent(scopedProject(),f.elements.sourceName.value,f.elements.content.value));showPanel('proposals');}if(f.id==='version-form'){const message=f.elements.message.value;await exclusive(async()=>{await engine.saveVersion(message||'Versão salva','Especialista local');renderPanel();updateStatus();toast('Versão preservada no histórico.');});}});});
document.addEventListener('dragstart',e=>{const el=e.target.closest('[data-kind]');if(locked()){e.preventDefault();return;}if(el)e.dataTransfer.setData('application/eventstorming',el.dataset.kind);});
document.addEventListener('dragover',e=>{if(e.target.closest('.board'))e.preventDefault();});
document.addEventListener('drop',e=>{if(locked()||!board||!e.target.closest('.board'))return;e.preventDefault();const kind=e.dataTransfer.getData('application/eventstorming');if(kinds[kind])add(kind,board.point(e));});
document.addEventListener('keydown',e=>{
  if(modalRoot.firstChild){if(e.key==='Escape')closeModal();if(e.key==='Tab'){const items=[...modalRoot.querySelectorAll('button,input,textarea,select,[tabindex]')].filter(el=>!el.disabled);const first=items[0],last=items.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}return;}
  if(!project||busy||e.target.closest('input,textarea,select,[contenteditable]'))return;
  if(e.key==='Escape'){connectionFrom=null;selected.clear();panel=null;board?.update();renderPanel();return;}
  if(locked())return;if(e.key==='Delete'||e.key==='Backspace'){e.preventDefault();removeSelected();}
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();run(()=>undo(e.shiftKey));}
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='d'){e.preventDefault();duplicate();}
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='a'){e.preventDefault();selected=new Set(currentMap().graph.nodes.filter(visible).map(n=>n.id));board?.update();}
  const card=e.target.closest('.sticky');if(card&&e.key==='Enter')select(card.dataset.id,e.shiftKey);if(card&&e.key==='F2'){e.preventDefault();board?.inline(card.dataset.id);}
  if(card&&['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();mutate(p=>{const n=currentMap(p).graph.nodes.find(n=>n.id===card.dataset.id);if(n.kind==='context'){const bounds=nodeBounds(n,currentMap(p).graph.nodes);n.position={x:bounds.x,y:bounds.y};n.properties.width=bounds.width;n.properties.height=bounds.height;}const d=e.shiftKey?40:20;if(e.key==='ArrowUp')n.position.y-=d;if(e.key==='ArrowDown')n.position.y+=d;if(e.key==='ArrowLeft')n.position.x-=d;if(e.key==='ArrowRight')n.position.x+=d;});$('.board')?.querySelector(`[data-id="${CSS.escape(card.dataset.id)}"]`)?.focus();}
});
window.addEventListener('beforeunload',e=>{if(project&&(revision>savedRevision||store.backend==='memory')){e.preventDefault();e.returnValue='';}});
window.addEventListener('offline',()=>{if(project)toast(store.backend==='memory'?'Sem conexão. A edição continua nesta sessão; exporte antes de fechar.':'Sem conexão. A edição e o salvamento local continuam disponíveis.');});
async function boot(){try{document.documentElement.dataset.theme=localStorage.getItem('es-local-theme')||'light';}catch{}await store.open();await refresh();renderHome();if(['http:','https:'].includes(location.protocol)&&location.protocol!=='file:' && !globalThis.__EVENT_STORM_STANDALONE__ && 'serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});}
run(boot);

return Object.freeze({  });
})();
})();
</script>
